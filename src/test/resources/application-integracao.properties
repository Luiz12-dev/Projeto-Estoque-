# =============================================================================
#  Perfil dos testes de integração — PostgreSQL real via Testcontainers
# =============================================================================
#  A URL, o usuário e a senha vêm do container, injetados por
#  @DynamicPropertySource em TesteDeIntegracao.
#
#  A diferença que justifica este perfil existir: aqui o esquema vem das
#  migrations, exatamente como em produção, e o Hibernate apenas CONFERE se as
#  entidades batem com ele. No perfil "test" o esquema é gerado pelo Hibernate
#  e o Flyway fica desligado, o que nunca exercita as migrations.
# =============================================================================

# Flyway ligado: o esquema é o mesmo que a produção recebe
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# validate, nunca create: o Hibernate confere as entidades contra o esquema
# das migrations e falha se divergirem. Atenção ao limite conhecido — o
# validate confere existência de tabela e coluna e o tipo, mas NÃO confere
# nulidade nem valor padrão.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Segredo fixo e longo o bastante para o VerificadorDeConfiguracao aceitar.
# Vale só para teste; não tem relação com nenhum ambiente real.
api.security.token.secret=segredo-exclusivo-de-teste-de-integracao-nao-usar-em-lugar-nenhum

api.cors.allowed-origins=http://localhost:4200

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN

# Bootstrap do primeiro administrador pelo caminho de PRODUÇÃO, e não pelo
# atalho de desenvolvimento. O perfil "integracao" não está na lista de perfis
# de desenvolvimento de propósito: assim o teste de contexto prova que a
# aplicação sobe num banco vazio do jeito que subiria na metalúrgica.
ADMIN_LOGIN=admin.integracao
ADMIN_SENHA=senha-de-teste-de-integracao
ADMIN_NOME=Administrador de Integração
