# =============================================================================
# Configuração de Teste — Banco H2 In-Memory
# =============================================================================
# Usa H2 compatível com PostgreSQL para que as queries JPQL e migrations
# rodem sem precisar de um PostgreSQL externo.

# Datasource H2 em modo de compatibilidade PostgreSQL
spring.datasource.url=jdbc:h2:mem:estoque_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Desabilita Flyway nos testes — o ddl-auto=create-drop gera o schema
# Flyway exige o driver PostgreSQL que não está disponível nos testes unitários
spring.flyway.enabled=false

# JWT
api.security.token.secret=test-secret-key-for-unit-tests-only-minimum-256-bits-required

# CORS
api.cors.allowed-origins=http://localhost:4200

# Logging reduzido nos testes
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
