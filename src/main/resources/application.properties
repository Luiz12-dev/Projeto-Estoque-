spring.application.name=estoque

# ===== PostgreSQL (Docker Compose) =====
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/estoque_metalurgica}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== JWT =====
# Sem valor padrão, e é de propósito: um segredo versionado no Git permite que
# qualquer pessoa com acesso ao repositório forje um token de ADMIN.
#
# A aplicação não sobe sem JWT_SECRET — quem valida é VerificadorDeConfiguracao,
# que explica na mensagem de erro qual variável falta e como gerar um valor.
# O default vazio abaixo existe só para o Spring conseguir resolver o
# placeholder e a falha vir com essa mensagem, em vez do erro cru de
# placeholder não resolvido.
api.security.token.secret=${JWT_SECRET:}

# ===== CORS =====
api.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4200,http://192.168.5.11:4200}
