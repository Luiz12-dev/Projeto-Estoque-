spring.application.name=estoque

# ===== PostgreSQL (Docker Compose) =====
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/estoque_metalurgica}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== JWT =====
# IMPORTANTE: Defina JWT_SECRET como variável de ambiente em produção.
# A aplicação falhará ao iniciar sem esta variável configurada.
api.security.token.secret=${JWT_SECRET:29041826689417938261821364192805444452318680625572018524063144044223164844635873198688903323643514647682631711720110982749413062494313578012951548403065986}

# ===== CORS =====
api.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4200,http://192.168.5.11:4200}
